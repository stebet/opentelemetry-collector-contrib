# Runnable example: receive OTLP traces, sample them with EMA, and log survivors.
# Mount your own configuration to export sampled traces to your backend.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100
  ema_sampling:
    sampling_attributes: [service.name]
    goal_sample_rate: ${env:EMA_GOAL_SAMPLE_RATE:-10}
    decision_wait: 10s
    num_traces: 50000
  batch: {}

exporters:
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, ema_sampling, batch]
      exporters: [debug]
